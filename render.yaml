
services:
  - type: web
    name: lino-ecomerce-api
    runtime: docker
    region: virginia
    plan: free

    dockerfilePath: ./Dockerfile.backend
    dockerContext: .

    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: DATABASE_URL
        sync: false

      - key: LINO_SESSION_SECRET
        generateValue: true

      - key: LINO_ADMIN_EMAIL
        sync: false

      - key: LINO_ADMIN_PASSWORD
        sync: false

      - key: LINO_ADMIN_NAME
        value: Administrador LINO

